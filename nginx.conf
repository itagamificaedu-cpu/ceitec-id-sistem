        ssl_certificate     /etc/letsencrypt/live/evolution.itatecnologiaeducacional.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/evolution.itatecnologiaeducacional.tech/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://172.17.0.1:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }
    }

