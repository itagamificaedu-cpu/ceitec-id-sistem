events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # DNS interno do Docker — re-resolve automaticamente quando containers reiniciam
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redireciona HTTP → HTTPS
    server {
        listen 80;
        server_name itatecnologiaeducacional.tech 2.24.73.137 localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://itatecnologiaeducacional.tech$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name itatecnologiaeducacional.tech;

        ssl_certificate     /etc/letsencrypt/live/itatecnologiaeducacional.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/itatecnologiaeducacional.tech/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Arquivos estáticos Django
        location /static/ {
            alias /var/www/static/;
        }

        location /media/ {
            alias /var/www/media/;
        }

        # Admin Django
        location /django-admin/ {
            set $upstream_django http://django:8000;
            proxy_pass $upstream_django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Página pública do aluno ItagGame (sem login)
        location = /itagame/aluno {
            set $upstream_react http://react:80;
            proxy_pass $upstream_react;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Redireciona /inscricao sem barra para /inscricao/
        location = /inscricao {
            return 301 /inscricao/;
        }

        # Portal Django
        location ~ ^/(accounts|ferramentas|gamification|corretor|assinar|webhook|itagame|relatorios|pedagogico|gestao-professores|login|logout|portal|master|ita|escola|sem-acesso|inscricao|desafio)/ {
            set $upstream_django http://django:8000;
            proxy_pass $upstream_django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Django
        location /api/ {
            set $upstream_django http://django:8000;
            proxy_pass $upstream_django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # Socket.io (WebSocket para Quiz ao Vivo e rastreamento)
        location /socket.io/ {
            set $upstream_node http://node:3001;
            proxy_pass $upstream_node;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # API Node.js
        location /node-api/ {
            set $upstream_node http://node:3001;
            rewrite ^/node-api/(.*) /api/$1 break;
            proxy_pass $upstream_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Fotos de alunos (uploads do Node.js) — carteirinha, cadastro, etc.
        location /uploads/ {
            set $upstream_node http://node:3001;
            proxy_pass $upstream_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ─── Bolão da Copa 2026 ─────────────────────────────────────────────────
        location /bolao/ {
            proxy_pass http://172.17.0.1:8099/bolao/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        # React SPA
        location / {
            set $upstream_react http://react:80;
            proxy_pass $upstream_react;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_intercept_errors on;
            error_page 404 = @react_fallback;
        }

        location @react_fallback {
            set $upstream_react http://react:80;
            proxy_pass $upstream_react;
        }
    }

    # ─── Evolution API — WhatsApp ────────────────────────────────────────────
    server {
        listen 80;
        server_name evolution.itatecnologiaeducacional.tech;

        location / {
            return 301 https://evolution.itatecnologiaeducacional.tech$request_uri;
