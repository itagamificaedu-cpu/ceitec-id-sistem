server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html nunca pode ficar em cache — senão o navegador continua usando
    # JS antigo mesmo depois de um novo deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Arquivos com hash no nome (Vite) podem cachear pra sempre com segurança
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
